<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="SportNest — משחקי חשיבה ואסטרטגיה: לבד, מול המחשב, בשניים או אונליין">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SportNest</title>
<style>:root{--bg:#0b0b0d;--bg2:#15151a;--card:#1b1b22;--card2:#24242e;--fg:#f4efe3;--muted:#9a95a6;--acc:#e8b84a;--acc2:#ffd877;--line:#34343f;--good:#59d28a;--bad:#ff6b6b;--on-acc:#1a1405;--r:16px}
:root[data-mode=day]{--bg:#f4efe6;--bg2:#ebe4d6;--card:#fffdf8;--card2:#f1eadc;--fg:#231f17;--muted:#7a7262;--line:#d9cfba;--on-acc:#fff;--good:#1f9d63;--bad:#c42f45}
:root[data-theme=gold]{--acc:#e8b84a;--acc2:#ffd877}:root[data-theme=gold][data-mode=day]{--acc:#b8860b;--acc2:#8c6508}
:root[data-theme=silver]{--acc:#c9d1dc;--acc2:#e6ebf2;--on-acc:#10141c}:root[data-theme=silver][data-mode=day]{--acc:#5d6b7e;--acc2:#3f4b5c;--on-acc:#fff}
:root[data-theme=emerald]{--acc:#4fd18b;--acc2:#8cebb6;--on-acc:#05200f}:root[data-theme=emerald][data-mode=day]{--acc:#1f9d63;--acc2:#157348;--on-acc:#fff}
:root[data-theme=ruby]{--acc:#ff6b7a;--acc2:#ff9aa5;--on-acc:#2b0610}:root[data-theme=ruby][data-mode=day]{--acc:#c42f45;--acc2:#9b2236;--on-acc:#fff}
:root[data-theme=ocean]{--acc:#5aaeff;--acc2:#9bcdff;--on-acc:#04122b}:root[data-theme=ocean][data-mode=day]{--acc:#1f78c8;--acc2:#165a96;--on-acc:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 70% at 15% 0%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(90% 60% at 100% 100%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.sc{display:none;flex:1;min-height:0;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));overflow-y:auto}
.sc.on{display:flex;animation:scIn .18s ease-out}
@keyframes scIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{flex:1;margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.ib{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:22px;cursor:pointer}
.ib:active,.btn:active,.tile:active,.lv:active{transform:scale(.96)}
.back{display:flex;align-items:center;gap:6px;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--acc);background:var(--card);color:var(--acc);font-weight:700;cursor:pointer;font-size:16px}
.btn{min-height:56px;padding:12px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.sm{min-height:48px;font-size:15px;padding:8px 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.brand{text-align:center;padding:10px 0 4px}
.brand .logo{font-size:44px;line-height:1}
.brand h2{margin:6px 0 2px;font-size:30px;font-weight:900;color:var(--acc);letter-spacing:.5px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{position:relative;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));padding:14px 12px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;overflow:hidden}
.tile .art{width:100%;height:84px;display:grid;place-items:center;font-size:52px}
.tile .art svg,.tile .art canvas{max-width:100%;max-height:84px}
.tile b{font-size:17px;text-align:center}
.tile small{color:var(--muted);font-size:12px;text-align:center}
.who{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-top:4px}
.who .av{font-size:30px}
.foot{margin-top:auto;padding-top:14px;text-align:center;color:var(--muted);font-size:12px}
.modes{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.modes .btn{justify-content:flex-start;text-align:start;min-height:68px}
.modes .btn .ic{font-size:30px;width:40px;text-align:center}
.modes .btn small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.modes .btn.pri small{color:var(--on-acc);opacity:.75}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}
.wh{font-weight:800;color:var(--acc);margin:12px 0 0;font-size:15px}
.lv{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;font-weight:800;cursor:pointer;min-height:68px}
.lv .st{font-size:13px;letter-spacing:1px;color:var(--acc);min-height:16px}
.lv.lock{opacity:.35;pointer-events:none}
.lv.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.row{display:flex;gap:10px;align-items:center}
.lbl{color:var(--muted);font-size:13px;margin:12px 2px 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:48px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.seg button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
input.txt{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;padding:0 14px;outline:none}
input.txt:focus{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;animation:scIn .15s}
.ov .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;max-height:88vh;overflow:auto;text-align:center}
.ov h3{margin:0 0 8px;font-size:22px}
.ov p{color:var(--muted);margin:6px 0 14px;line-height:1.5}
.ov .btn{width:100%;margin-top:10px}
.big-st{font-size:40px;letter-spacing:6px;color:var(--acc);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;max-width:86vw;text-align:center;animation:scIn .15s}
/* ---- משחק ---- */
#play{position:relative;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}
.hud{display:flex;align-items:center;gap:8px;min-height:44px}
.hud .ib{width:46px;height:46px;font-size:20px}
.hud .stat{flex:1;display:flex;justify-content:space-around;font-weight:800;direction:ltr}
.hud .stat span small{display:block;color:var(--muted);font-weight:500;font-size:11px;text-align:center}
.stage{flex:1;min-height:0;display:flex;gap:8px;align-items:stretch;direction:ltr}
.col{display:flex;flex-direction:column;gap:8px;width:30%;max-width:130px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;place-items:center}
.panel canvas{width:100%;display:block}
.boardwrap{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
.boardwrap canvas{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--line);touch-action:none}
.pend{position:absolute;inset-inline-start:-1px;bottom:0;width:7px;background:var(--bad);border-radius:4px;transition:height .12s;height:0}
.ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.ctrl button{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:26px;cursor:pointer;touch-action:none}
.ctrl button:active,.ctrl button.dn{background:var(--acc);color:var(--on-acc)}
.voice{display:flex;gap:8px;align-items:center;direction:ltr}
.voice button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;touch-action:none;font-size:15px}
.voice button.dn{background:var(--good);color:#06200f}
.talking{color:var(--good);font-weight:700;font-size:13px}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;color:var(--acc);text-shadow:0 4px 24px #000;pointer-events:none;z-index:5}
/* שניים בטלפון: שוכב */
.two{flex-direction:row!important}
.two .side{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hint{color:var(--muted);font-size:13px;text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--muted)}
.wrap-lobby{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.code{font-size:44px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--acc);direction:ltr}
.seats .card{display:flex;align-items:center;gap:10px}
.seats .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.seats .dot.on{background:var(--good)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.brand .logo{font-size:30px}.tile{min-height:120px}.tile .art{height:60px;font-size:38px}}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:ltr}
.strip .panel{padding:3px;border-radius:10px}
.oppcol{width:74px;flex:none}
.oppcol .panel{padding:4px 3px}
.two .side .panel{border-radius:10px}

.two .side{justify-content:flex-end}
.two .boardwrap{flex:none}
.two .ctrl{grid-template-columns:1fr 1fr}
.two .ctrl button{min-height:clamp(52px,8.5vh,84px)}
.two .ctrl [data-k=ccw]{order:1}.two .ctrl [data-k=cw]{order:2}.two .ctrl [data-k=left]{order:3}.two .ctrl [data-k=right]{order:4}.two .ctrl [data-k=drop]{order:5;grid-column:1/3}

/* ---- מעטפת AppNest: בית, כלים, הגדרות, אודות, אלבום ---- */
.hero{position:relative;text-align:center;padding:6px 0 4px}
.hero .me{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 14px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px}
.hero .me .av{font-size:26px}
.hero .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.quick{display:flex;gap:8px}.quick button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:21px;cursor:pointer}
.wordmark{font-size:36px;font-weight:900;letter-spacing:.5px;margin-top:6px}.wordmark i{font-style:normal;color:var(--acc)}
.sub{color:var(--muted);font-size:14px}
.floaty{display:flex;justify-content:center;gap:14px;font-size:26px;opacity:.85;margin-top:4px}
.dailyb{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border-radius:var(--r);border:1px solid var(--acc);background:linear-gradient(120deg,var(--card2),var(--card));cursor:pointer;padding:10px 14px;text-align:start;margin-top:10px}
.dailyb .ic{font-size:34px}.dailyb b{display:block;font-size:17px}.dailyb small{color:var(--muted);font-size:13px}
.dailyb.done{border-color:var(--good)}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:8px;direction:ltr}
.week i{flex:1;text-align:center;font-style:normal;font-size:11px;color:var(--muted);padding:6px 0;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.week i.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:800}.week i.today{border-color:var(--acc)}
.resume{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);cursor:pointer;padding:8px 14px;margin-top:10px;text-align:start;font-weight:700}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.tools button{min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;cursor:pointer}
.tools button i{font-style:normal;font-size:26px}
.badge{text-align:center;color:var(--muted);font-size:12px;padding:6px 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:4px 0}
.sw small{display:block;color:var(--muted);font-size:12px}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
.card h3{margin:0 0 10px;font-size:16px}
.card+.card{margin-top:10px}
.avs{display:flex;flex-wrap:wrap;gap:8px}.avs button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:28px;cursor:pointer}.avs button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat3 b{display:block;font-size:22px;color:var(--acc)}.stat3 span{font-size:12px;color:var(--muted)}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stk button{min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;padding:6px;opacity:.38;filter:grayscale(1)}
.stk button.got{opacity:1;filter:none;border-color:var(--acc)}.stk button i{font-style:normal;font-size:34px}
.rules h2{margin:14px 0 6px;font-size:18px;color:var(--acc)}.rules p{margin:6px 0;line-height:1.55}
.gbig{font-size:64px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.linkbtn{text-decoration:none;color:inherit}

<script>
const ART_FILES = ["air-mallet0","air-mallet1","air-puck","air-table","arch-arrow","arch-target","bg-air","bg-arch","bg-bowl","bg-box","bg-dart","bg-fb","bg-hoop","bg-pen","bg-tt","bowl-lane","box-head1","box-head2","dart-dart","fb-ball","fb-field","fb-man0","fb-man1","golf-grass","golf-sand","golf-wall","hoop-ball","hoop-def","hoop-player","pen-ball","pen-dummy","pen-keeper","snk-cue","snk-felt","snk-wood","tile-air","tile-arch","tile-bowl","tile-box","tile-dart","tile-fb","tile-golf","tile-hoop","tile-pen","tile-snk","tile-tt","tt-ball","tt-paddle0","tt-paddle1"];
/* ===== src/nestlink.js ===== */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };

      bowl_strike: 'אסטרייק!', bowl_spare: 'ספייר!', bowl_gutter: 'מרזב', bowl_ball: 'כדור', bowl_goal: 'יעד', bowl_frame: 'סיבוב', bowl_none: 'לא נפל כלום',
      ru_bowl: '<p>בכל כדור מגלגלים כדור לעבר עשרה קיפולים ומנסים להפיל כמה שיותר. כדי להתחיל גוררים את הכדור שמאלה וימינה על קו ההתחלה. אחר כך מזיזים אצבע על הנתיב כדי לסובב את הכוונה, ולכוונון עדין במיוחד יש שני חצים קטנים. הקו המנוקד מראה את דרך הכדור עד הקיפול הראשון.</p><p>הנתיב משומן בתחילתו, ובהמשכו הכדור מתחיל להתפתל לכיוון הפיתול שבחרתם בפס הפיתול. ככה אפשר להיכנס לכיס שבין קיפול 1 ל-3, שם נופלים הכי הרבה קיפולים. את העוצמה קובעים בפס שמתחת לנתיב, ומגלגלים בלחיצה על "הכה". כדור שנכנס למרזב לא מפיל כלום.</p><p>במשחק מול יריב משחקים חמישה סיבובים, בכל סיבוב עד שני כדורים. אסטרייק (עשרה בכדור הראשון) מוסיף בונוס של שני הכדורים הבאים, וספייר (עשרה בשני כדורים) מוסיף בונוס של הכדור הבא. בסיבוב האחרון אחרי אסטרייק או ספייר מקבלים כדורים נוספים. מי שצבר יותר נקודות מנצח.</p><p>בשלבים צריך להפיל מספר קיפולים נתון במספר כדורים מוגבל, לפעמים כשיש עמודים או כתמי שמן בנתיב. ככל שפחות כדורים נדרשו, כך יותר כוכבים.</p>' },
    en: { g_bowl: 'Bowling', d_bowl: 'Aim, curve and knock down all the pins',

      ru_bowl: '<p>بكل كرة ترمي نحو عشرة دبابيس وتحاول إسقاط أكبر عدد ممكن. للبدء اسحب الكرة يميناً ويساراً على خط البداية. ثم حرّك إصبعك على المسار لتدوير التصويب، وهناك سهمان صغيران لضبط دقيق جداً. يُظهر الخط المنقّط مسار الكرة حتى أول دبوس.</p><p>الجزء الأول من المسار مدهون بالزيت، وبعده تبدأ الكرة بالالتفاف في الاتجاه الذي ضبطته على شريط الدوران. هكذا تصل إلى الفجوة بين الدبوسين 1 و3 حيث يسقط أكثر عدد من الدبابيس. اضبط القوة على الشريط تحت المسار واضغط اضرب. الكرة التي تسقط في المجرى لا تُسقط شيئاً.</p><p>أمام خصم تلعبان خمس جولات من كرتين كحد أقصى. الضربة الكاملة (عشرة دبابيس بالكرة الأولى) تضيف مكافأة الكرتين التاليتين، والسبير (عشرة بكرتين) يضيف مكافأة الكرة التالية. في الجولة الأخيرة بعد ضربة كاملة أو سبير تحصل على كرات إضافية. يفوز من جمع نقاطاً أكثر.</p><p>في المراحل عليك إسقاط عدد معين من الدبابيس بعدد محدود من الكرات، أحياناً مع أعمدة أو بقع زيت في المسار. كلما احتجت كرات أقل نلت نجوماً أكثر.</p>' }

      ru_tt: '<p>זה טניס שולחן בזמן אמת, מנקודת מבט של מי שעומד בקצה השולחן. הכדור עף באוויר, קופץ על השולחן ועובר מעל הרשת. המחבט שלכם נמצא במישור בקצה השולחן ועוקב אחרי האצבע, מעט מעל האצבע כדי שיהיה אפשר לראות אותו. כדי להחזיר, מביאים את המחבט אל הכדור כשהוא מגיע אליכם.</p><p>איך מכוונים: מקום המגע על המחבט קובע לאן הכדור יעוף. פוגעים בצד שמאל של המחבט, הכדור הולך שמאלה. תנועה מהירה של האצבע בזמן המגע נותנת חבטה חזקה ועמוקה יותר, ותנועה אטית נותנת החזרה רכה. תנועה כלפי מעלה בזמן המגע מוסיפה סיבוב קדימה, שגורם לכדור להאיץ אחרי הקפיצה. תנועה כלפי מטה נותנת סיבוב אחורה, והכדור מאט. חבטה חזקה מדי או בקצה המחבט יכולה ללכת לרשת או החוצה.</p><p>הכללים: הכדור חייב לקפוץ פעם אחת בחצי של היריב, ולא לגעת ברשת. אם הכדור קופץ אצלכם פעמיים לפני שהחזרתם, הנקודה של היריב. ההגשות אוטומטיות, ומתחלפות כל שתי נקודות. במשחק מול יריב מנצח הראשון לשבע נקודות. בשלבים הגבוהים משחקים עד 11 עם הפרש של שתיים, והיריב חזק יותר בכל שלב, ויש שולחנות מהירים ורשת גבוהה. בשלבים הראשונים יש עיגול מקווקו שמראה לאן הכדור מגיע. בשני שחקנים על טלפון אחד כל שחקן במחצית שלו ומזיז את המחבט שלו.</p>' },
    en: { g_tt: 'Table Tennis', d_tt: 'A ball in the air, a bounce and a net: time your swing and return it',

      tt_help: 'Двигайте пальцем, чтобы подвести ракетку к мячу. Место касания и скорость движения определяют, куда полетит мяч', tt_two_help: 'Каждый игрок двигает свою ракетку на своей стороне стола', tt_to: 'До {n}',

      ru_tt: '<p>Это настольный теннис в реальном времени с видом из-за вашего края стола. Мяч летит по воздуху, отскакивает от стола и перелетает через сетку. Ваша ракетка находится в плоскости на краю стола и следует за пальцем, чуть выше него, чтобы её было видно. Чтобы вернуть мяч, подведите ракетку к мячу, когда он подлетает.</p><p>Как целиться: место, где мяч встречает ракетку, определяет, куда он полетит. Ударите левой частью ракетки — мяч уйдёт влево. Быстрое движение пальца в момент касания даёт сильный и более глубокий удар, медленное — мягкий возврат. Движение вверх при ударе добавляет верхнее вращение, и мяч ускоряется после отскока. Движение вниз добавляет нижнее вращение, и мяч замедляется. Слишком сильный удар или удар краем ракетки может уйти в сетку или в аут.</p><p>Правила: мяч должен один раз отскочить на половине соперника и не задеть сетку. Если он дважды отскочит на вашей половине, пока вы его не вернули, очко у соперника. Подачи автоматические и меняются каждые два очка. Против соперника побеждает первый, набравший семь очков. На высоких уровнях играют до 11 с разницей в два очка, соперник каждый раз сильнее, есть более быстрые столы и высокая сетка. На первых уровнях пунктирный круг показывает, куда прилетит мяч. В режиме для двух игроков каждый двигает свою ракетку на своей половине.</p>' },
    es: { g_tt: 'Tenis de mesa', d_tt: 'Una pelota en el aire, un bote y una red: golpea a tiempo y devuélvela',

      ru_tt: '<p>Es tenis de mesa en tiempo real, visto desde detrás de tu extremo de la mesa. La pelota vuela por el aire, bota en la mesa y pasa por encima de la red. Tu pala está en un plano al final de la mesa y sigue tu dedo, un poco por encima para que se vea. Para devolver la pelota, lleva la pala hasta ella cuando llegue.</p><p>Cómo apuntar: el punto donde la pelota encuentra la pala decide adónde va. Si la golpeas con la parte izquierda de la pala, va a la izquierda. Un movimiento rápido del dedo en el momento del contacto da un golpe más fuerte y profundo, uno lento una devolución suave. Moverte hacia arriba al golpear añade efecto liftado y la pelota se acelera tras el bote. Moverte hacia abajo añade efecto cortado y la pelota se frena. Un golpe demasiado fuerte, o dado con el borde de la pala, puede ir a la red o fuera.</p><p>Reglas: la pelota debe botar una vez en la mitad del rival y no tocar la red. Si bota dos veces en tu mitad antes de que la devuelvas, el punto es del rival. Los saques son automáticos y cambian cada dos puntos. Contra un rival gana quien llegue primero a siete. En los niveles altos se juega a 11 con diferencia de dos, el rival es más fuerte cada vez y hay mesas más rápidas y una red más alta. En los primeros niveles un círculo discontinuo muestra adónde llega la pelota. En dos jugadores cada uno mueve su pala en su mitad.</p>' },

/* ===== src/app.js ===== */
'use strict';
/* SportNest — מעטפת: שפות, אחסון, ניווט, מסכים, אונליין (NestLink). המשחקים נרשמים ב-Games. */
const APP_VERSION = '2.0.0';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('⚠ שמירה נכשלה'); return false; } }
};
const AVATARS = ['🦉', '🦔', '🦊', '🐧', '🐯', '🐨', '🐙', '🦜'];
const THEMES = ['gold', 'silver', 'emerald', 'ruby', 'ocean'];
const defLang = () => { const l = (navigator.language || 'he').slice(0, 2); return LANG[l] ? l : 'he'; };
const S = Object.assign({ lang: store.get('sn_lang_default', null) || 'he', theme: 'gold', mode: 'night', sound: true, vib: true, name: '', av: AVATARS[0], guide: false }, store.get('sn_set', {}));
if (THEMES.indexOf(S.theme) < 0) S.theme = 'gold'; if (!S.mode) S.mode = 'night';
const saveS = () => store.set('sn_set', S);
const P = store.get('sn_prog', {});            // התקדמות: P[game] = {lv:{n:stars}, games, wins}
const saveP = () => store.set('sn_prog', P);
const pg = g => P[g] || (P[g] = { lv: {}, games: 0, wins: 0 });
function T(k, o) {
  let s = (LANG[S.lang] && LANG[S.lang][k]) || LANG.en[k] || k;
  if (o) for (const a in o) s = s.split('{' + a + '}').join(o[a]);
  return s;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function applyLang() { const d = LANG[S.lang].dir; document.documentElement.lang = S.lang; document.documentElement.dir = d; document.title = 'SportNest · ' + T('app_sub'); }
function applyTheme() { document.documentElement.dataset.theme = S.theme; document.documentElement.dataset.mode = S.mode; const m = $('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0b0d'; }
const nameOr = () => S.name || T('you');

/* ---------- צלילים (מסונתזים) ---------- */
let AC = null;
function tone(f, d, type, v, delay) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.07, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const SFX = {
  tap() { tone(520, 0.05, 'triangle', 0.05); },
  move() { tone(300, 0.03, 'square', 0.02); },
  rot() { tone(440, 0.05, 'triangle', 0.04); },
  lock() { tone(150, 0.08, 'sine', 0.08); },
  line(n) { for (let i = 0; i < Math.min(4, n + 1); i++) tone(520 + i * 160, 0.12, 'triangle', 0.07, i * 0.06); },
  hit() { tone(110, 0.2, 'sawtooth', 0.06); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.08, i * 0.1)); },
  lose() { [330, 262, 196].forEach((f, i) => tone(f, 0.22, 'sawtooth', 0.05, i * 0.14)); },
  count() { tone(660, 0.1, 'square', 0.04); }, go() { tone(990, 0.22, 'square', 0.05); }
};
const vib = ms => { if (S.vib && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} };

/* ---------- ציורים (אופציונלי: art/<שם>.webp; בלי הקובץ — האפליקציה מציירת בקוד) ---------- */
const Art = { img: {}, get(n) { return this.img[n] || null; }, init() { let t = 0; (typeof ART_FILES !== 'undefined' ? ART_FILES : []).forEach(n => { const i = new Image(); i.onload = () => { Art.img[n] = i; clearTimeout(t); t = setTimeout(() => { if (curSc === 'home') render('home'); }, 120); }; i.src = 'art/' + n + '.webp'; }); } };
const artImg = (n, st) => Art.get(n) ? `<img src="art/${n}.webp" alt="" style="max-width:100%;max-height:100%;object-fit:contain;${st || ''}">` : '';

function setPlayBg(g) { const el = $('#play'); el.dataset.bg = g; el.style.backgroundImage = Art.get('bg-' + g) ? 'url(art/bg-' + g + '.webp)' : ''; }

/* ---------- חלונות והודעות ---------- */
const overlays = [];
function openOv(html, cls) {
  const o = document.createElement('div'); o.className = 'ov ' + (cls || ''); o.innerHTML = '<div class="box">' + html + '</div>';
  document.body.appendChild(o); overlays.push(o); syncHistory(); return o;
}
function closeOv(o) { if (!o) o = overlays[overlays.length - 1]; const i = overlays.indexOf(o); if (i >= 0) overlays.splice(i, 1); if (o && o.parentNode) o.remove(); if (o && o.onclose) { const f = o.onclose; o.onclose = null; f(); } syncHistory(); }
const topOverlay = () => overlays[overlays.length - 1];
function confirmBox(text, yes, no) {
  const o = openOv('<p style="color:var(--fg);font-size:18px">' + esc(text) + '</p><button class="btn pri" data-y>' + T('yes') + '</button><button class="btn" data-n>' + T('no') + '</button>');
  $('[data-y]', o).onclick = () => { closeOv(o); yes && yes(); }; $('[data-n]', o).onclick = () => { closeOv(o); no && no(); };
}
let toastT = 0;
function toast(msg, ms) { $$('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), ms || 2200); }

/* ---------- ניווט וכפתור חזרה ---------- */
let curSc = 'home', stack = [], exitArm = 0, hist = { guard: false, ignore: 0 };
const Games = {};         // id → {ready, icon(), levels, start...}
let curGame = null, activeRun = null;  // activeRun = אובייקט משחק רץ עם destroy()
function show(id, push) {
  if (push !== false && curSc !== id) stack.push(curSc);
  $$('.sc').forEach(s => s.classList.toggle('on', s.id === id)); curSc = id;
  if (id !== 'play' && activeRun) { try { activeRun.destroy(); } catch (e) {} activeRun = null; }
  const s = $('#' + id); if (s) s.scrollTop = 0;
  syncHistory();
}
function goBack() {
  if (curSc === 'play' && activeRun && activeRun.onBack) { activeRun.onBack(); return; }
  const prev = stack.pop() || 'home'; show(prev, false); render(prev);
}
function syncHistory() {
  const need = !exitArm;
  if (need && !hist.guard) { history.pushState({ g: 1 }, ''); hist.guard = true; }
  else if (!need && hist.guard) { hist.guard = false; hist.ignore++; history.back(); }
}
window.addEventListener('popstate', () => {
  if (hist.ignore > 0) { hist.ignore--; return; } hist.guard = false;
  if (topOverlay()) { const o = topOverlay(); if (o.dataset.nobk) { syncHistory(); return; } closeOv(o); }
  else if (curSc === 'play' && activeRun && activeRun.onBack) activeRun.onBack();
  else if (curSc !== 'home') goBack();
  else { toast(T('exit_again'), 2000); exitArm = setTimeout(() => { exitArm = 0; syncHistory(); }, 2000); return; }
  syncHistory();
});
function render(id) { const f = RENDER[id]; if (f) f(); }

/* ---------- מסכים ---------- */
const RENDER = {};
RENDER.home = () => {
  const el = $('#home');
  el.innerHTML = `
  <div class="top"><h1></h1><button class="ib" data-act="settings" aria-label="${T('settings')}">⚙️</button></div>
  <div class="brand"><div class="logo">🪺</div><h2>SportNest</h2><p>${T('app_sub')}</p></div>
  <div class="who"><span class="av">${S.av}</span><div style="flex:1"><b>${esc(nameOr())}</b><div class="hint" style="text-align:start">${T('tagline')}</div></div><button class="ib" data-act="theme" aria-label="${T('theme')}">🎨</button></div>
  <div class="tiles">${Object.keys(Games).filter(g => Games[g].ready).map(g => `<div class="tile" data-g="${g}"><div class="art">${artImg('tile-' + g) || Games[g].art()}</div><b>${T('g_' + g)}</b><small>${T('d_' + g)}</small></div>`).join('')}</div>
  <div class="foot">SportNest ${APP_VERSION} · AppNest 🪺</div>`;
  $$('[data-g]', el).forEach(t => t.onclick = () => { SFX.tap(); openGame(t.dataset.g); });
  $('[data-act=settings]', el).onclick = () => { show('settings'); render('settings'); };
  $('[data-act=theme]', el).onclick = () => { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]; saveS(); applyTheme(); };

    <div class="floaty" aria-hidden="true"><span>⚽</span><span>🥅</span><span>🏀</span><span>🎯</span><span>🥊</span></div></div>
  ${nl ? `<button class="resume" data-act="resume"><span style="font-size:28px">${GICON[last]}</span><span style="flex:1">${T('cont')}: ${esc(gTitle(last))} · ${T('s_level')} ${nl}</span><span>▶</span></button>` : ''}
  <button class="dailyb ${done ? 'done' : ''}" data-act="daily"><span class="ic">${done ? '✅' : '📅'}</span><span style="flex:1"><b>${T('daily')}</b><small>${esc(gTitle(dt.g))} · ${T('s_level')} ${dt.n}${streak ? ' · 🔥 ' + T('streak_n', { n: streak }) : ''}</small></span></button>
  <div class="week">${wk.join('')}</div>
  <div class="tiles">${Object.keys(Games).filter(g => Games[g].ready).map(g => `<div class="tile" data-g="${g}"><div class="art">${artImg('tile-' + g) || Games[g].art()}</div><b>${T('g_' + g)}</b><small>${T('d_' + g)}</small></div>`).join('')}${Object.keys(Games).filter(g => Games[g].ready).length % 2 ? `<div class="tile" style="opacity:.6;cursor:default"><div class="art">${artImg('tile-next1') || '<span style="font-size:52px">🪺</span>'}</div><b>${({he:'בקרוב',en:'Coming soon',ru:'Скоро',es:'Próximamente',ar:'قريباً'})[S.lang] || ''}</b><small>&nbsp;</small></div>` : ''}</div>
  <div class="tools"><button data-act="rules"><i>📖</i><span>${T('rules')}</span></button><button data-act="album"><i>🃏</i><span>${T('album')}</span></button><button data-act="stats"><i>🏅</i><span>${T('stats')}</span></button><button data-act="settings"><i>⚙️</i><span>${T('settings')}</span></button></div>
  <div class="badge">AppNest · <b>SportNest</b> · v${APP_VERSION}</div>`;
  $$('[data-g]', el).forEach(t => t.onclick = () => { SFX.tap(); openGame(t.dataset.g); });
  const A = (a, f) => { const b = $('[data-act=' + a + ']', el); if (b) b.onclick = () => { SFX.tap(); f(); }; };
  A('me', playersBox); A('theme', () => { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]; saveS(); applyTheme(); toast(T('theme') + ': ' + T('th_' + S.theme), 1200); });
  A('mode', () => { S.mode = S.mode === 'day' ? 'night' : 'day'; saveS(); applyTheme(); render('home'); });
  A('about', () => { show('about'); render('about'); }); A('settings', () => { show('settings'); render('settings'); });
  A('rules', () => { show('rules'); render('rules'); }); A('album', () => { show('album'); render('album'); }); A('stats', () => { show('stats'); render('stats'); });
  A('resume', () => { curGame = last; Games[last].startSolo(nl); });
  A('daily', () => { curGame = dt.g; Games[dt.g].startSolo(dt.n); });
};
function playersBox() {
  const o = openOv(`<h3>${T('me')}</h3><div class="lbl" style="margin-top:0;text-align:start">${T('name')}</div><input class="txt" id="pbName" maxlength="14" value="${esc(S.name)}" placeholder="${T('you')}"><div class="lbl" style="text-align:start">${T('pick_av')}</div><div class="avs" id="pbAv" style="justify-content:center">${AVATARS.map(a => `<button data-a="${a}" class="${S.av === a ? 'on' : ''}">${a}</button>`).join('')}</div><button class="btn pri" data-x>${T('ok')}</button>`);
  $('#pbName', o).oninput = e => { S.name = e.target.value.slice(0, 14); saveS(); };
  $$('#pbAv button', o).forEach(b => b.onclick = () => { S.av = b.dataset.a; saveS(); $$('#pbAv button', o).forEach(x => x.classList.toggle('on', x === b)); });
  $('[data-x]', o).onclick = () => { closeOv(o); if (curSc === 'home') render('home'); };
}
/* ---------- חוקים / הישגים / אלבום ---------- */
RENDER.rules = () => {
  const el = $('#rules'); el.innerHTML = backBar(T('rules')) + '<div class="rules">' + GAME_IDS.map(g => `<h2>${GICON[g]} ${esc(gTitle(g))}</h2>${T('ru_' + g)}`).join('') + '</div>'; wireBack(el);
};
RENDER.stats = () => {
  const el = $('#stats'), d = META.daily, streak = d.last && dayNo() - dayNo(d.last) <= 1 ? d.streak : 0;
  let h = backBar(T('stats')) + `<div class="card"><h3>🔥 ${T('daily')}</h3><div class="stat3"><div><b>${streak}</b><span>${T('s_streak')}</span></div><div><b>${d.best}</b><span>${T('s_best')}</span></div><div><b>${Object.keys(d.done).length}</b><span>${T('s_dailies')}</span></div></div></div>`;
  for (const g of GAME_IDS) { const p = pg(g); h += `<div class="card"><h3>${GICON[g]} ${esc(gTitle(g))}</h3><div class="stat3"><div><b>${doneOf(g)}/${NLEV(g)}</b><span>${T('s_done')}</span></div><div><b>${starsOf(g)}</b><span>${T('s_stars')}</span></div><div><b>${Object.values(p.lv).filter(x => x >= 3).length}</b><span>${T('s_three')}</span></div></div><div class="stat3" style="margin-top:8px"><div><b>${p.wins || 0}</b><span>${T('s_wins')}</span></div><div><b>${p.games || 0}</b><span>${T('s_games')}</span></div><div></div></div></div>`; }
  el.innerHTML = h; wireBack(el);
};
RENDER.album = () => {
  const el = $('#album'), n = STICKERS.filter(s => META.stk[s[0]]).length;
  el.innerHTML = backBar(T('album')) + `<p class="hint">${T('album_d')} · ${n}/${STICKERS.length}</p><div class="stk">${STICKERS.map(([id, ic]) => `<button data-s="${id}" class="${META.stk[id] ? 'got' : ''}"><i>${ic}</i><span>${esc(T('st_' + id))}</span></button>`).join('')}</div>`; wireBack(el);
  $$('[data-s]', el).forEach(b => b.onclick = () => { const id = b.dataset.s; toast((META.stk[id] ? '🏅 ' : '🔒 ') + T('std_' + id), 3000); });
};
/* ---------- הגדרות, גיבוי ---------- */
const seg = (id, items, cur) => `<div class="seg" data-seg="${id}">${items.map(([v, l]) => `<button data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
RENDER.settings = () => {
  const el = $('#settings');
  el.innerHTML = backBar(T('settings')) + `
  <div class="card"><div class="lbl" style="margin-top:0">${T('name')}</div><input class="txt" id="sName" maxlength="14" value="${esc(S.name)}" placeholder="${T('you')}"><div class="lbl">${T('pick_av')}</div><div class="avs" id="sAv">${AVATARS.map(a => `<button data-a="${a}" class="${S.av === a ? 'on' : ''}">${a}</button>`).join('')}</div></div>
  <div class="card"><h3>${T('lang')}</h3>${seg('lang', Object.keys(LANG).filter(l => LANG[l].name).map(l => [l, LANG[l].name]), S.lang)}</div>
  <div class="card"><h3>${T('look')}</h3><div class="lbl" style="margin-top:0">${T('theme')}</div>${seg('theme', THEMES.map(t => [t, T('th_' + t)]), S.theme)}<div class="lbl">${T('daymode')}</div>${seg('mode', [['night', '🌙 ' + T('night')], ['day', '☀️ ' + T('day')]], S.mode)}</div>
  <div class="card"><h3>${T('gameplay')}</h3>${[['sound', 'sound'], ['vib', 'vib']].map(([k, t]) => `<div class="sw"><span>${T(t)}</span><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''}></div>`).join('')}</div>
  <div class="card"><h3>${T('backup')}</h3><p class="hint" style="text-align:start">${T('backup_d')}</p><div class="row"><button class="btn" id="bkOut" style="flex:1">⬇️ ${T('export')}</button><button class="btn" id="bkIn" style="flex:1">⬆️ ${T('import')}</button></div><input type="file" id="bkFile" accept="application/json,.json" style="display:none"></div>
  <div class="card"><div class="row"><button class="btn" id="stGuide" style="flex:1">🧭 ${T('guide')}</button><button class="btn" id="stAbout" style="flex:1">ℹ️ ${T('about')}</button></div></div>
  <button class="btn" id="sReset" style="margin-top:12px;border-color:var(--bad);color:var(--bad)">🗑 ${T('reset_all2')}</button>`;
  wireBack(el);
  $('#sName', el).oninput = e => { S.name = e.target.value.slice(0, 14); saveS(); };
  $$('#sAv button', el).forEach(b => b.onclick = () => { S.av = b.dataset.a; saveS(); render('settings'); });
  $$('[data-seg]', el).forEach(sg => $$('button', sg).forEach(b => b.onclick = () => { const k = sg.dataset.seg; S[k] = b.dataset.v; saveS(); if (k === 'lang') applyLang(); applyTheme(); render('settings'); }));
  $$('[data-k]', el).forEach(c => c.onchange = () => { S[c.dataset.k] = c.checked; saveS(); });
  $('#bkOut', el).onclick = exportBackup; $('#bkIn', el).onclick = () => $('#bkFile', el).click();
  $('#bkFile', el).onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; };
  $('#stGuide', el).onclick = () => showGuide(); $('#stAbout', el).onclick = () => { show('about'); render('about'); };
  $('#sReset', el).onclick = () => confirmBox(T('reset_q1'), () => confirmBox(T('reset_q2'), () => { try { Object.keys(localStorage).filter(k => k.indexOf('sn_') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); }));
};
function exportBackup() {
  const data = { app: 'sportnest', v: APP_VERSION, by: S.name, date: new Date().toISOString(), settings: S, prog: P, meta: META };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), name = 'sportnest-backup-' + dayKey() + '.json';
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'SportNest' }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(T('exported'));
}
function importBackup(f) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast(T('bad_file')); return; }
    if (!d || d.app !== 'sportnest' || !d.prog) { toast(T('bad_file')); return; }
    confirmBox(T('import_q', { n: d.by || '?', d: (d.date || '').slice(0, 10) }), () => { store.set('sn_set', d.settings || {}); store.set('sn_prog', d.prog || {}); store.set('sn_meta', d.meta || {}); location.reload(); });
  };
  r.readAsText(f);
}
/* ---------- אודות ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
RENDER.about = () => {
  const el = $('#about'), nl = GAME_IDS.reduce((a, g) => a + NLEV(g), 0), link = location.origin + location.pathname;
  el.innerHTML = backBar(T('about')) + `<div class="card" style="text-align:center"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 style="margin:8px 0 2px">SportNest</h2><div class="hint">${T('app_sub')}</div><div class="hint" style="direction:ltr">v${APP_VERSION}</div></div>
  <div class="card">${[['a_ver', 'v' + APP_VERSION], ['a_dev', 'Barak Aflalo'], ['a_plat', 'PWA · HTML5'], ['a_store', T('a_local')], ['a_levels', nl], ['a_lic', '© AppNest 2026']].map(([k, v]) => `<div class="sw"><span>${T(k)}</span><b style="direction:ltr">${v}</b></div>`).join('')}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><a class="btn linkbtn" href="https://appnest-store.pages.dev" target="_blank" rel="noopener">🏪 ${T('a_storeLink')}</a><button class="btn" id="aShare">📤 ${T('a_share')}</button>${deferredInstall ? `<button class="btn" id="aInst">📲 ${T('install')}</button>` : ''}<a class="btn linkbtn" href="mailto:appnest55@gmail.com?subject=SportNest">✉️ ${T('a_feedback')}</a><button class="btn" id="aGuide">🧭 ${T('guide')}</button><a class="btn linkbtn" href="privacy_policy.html" target="_blank">🔒 ${T('a_privacy')}</a></div>
  <div class="card"><p class="hint" style="margin:0;text-align:start">${T('a_disc')}</p></div>`; wireBack(el);
  $('#aShare', el).onclick = () => { const d = { title: 'SportNest', text: T('share_txt', { n: S.name || '' }), url: link }; if (navigator.share) navigator.share(d).catch(() => {}); else (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast(T('copied'))).catch(() => toast(link, 4000)); };
  const ib = $('#aInst', el); if (ib) ib.onclick = () => { deferredInstall.prompt(); deferredInstall = null; };
  $('#aGuide', el).onclick = () => showGuide();
};
/* ---------- מדריך (5 שלבים) ---------- */
function showGuide() {
  if (guideEl) return; let i = 0; const steps = [['🪺', 'g1'], ['🗺️', 'g2'], ['👆', 'g3'], ['📅', 'g4'], ['👥', 'g5']];
  const draw = () => {
    guideEl.innerHTML = `<div class="box"><div class="gbig">${steps[i][0]}</div><h3>${T(steps[i][1] + 't')}</h3><p>${T(steps[i][1])}</p><div class="dots">${steps.map((s, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><button class="btn pri" data-n>${i === steps.length - 1 ? T('letsplay') : T('next')}</button><button class="btn sm" data-s>${T('skip')}</button></div>`;
    $('[data-n]', guideEl).onclick = () => { if (++i >= steps.length) endGuide(); else draw(); }; $('[data-s]', guideEl).onclick = endGuide;
  };
  guideEl = document.createElement('div'); guideEl.className = 'ov'; guideEl.dataset.nobk = 1; document.body.appendChild(guideEl); overlays.push(guideEl); syncHistory(); draw();
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

GAME_IDS.forEach(g => { const G0 = Games[g], f = G0.startSolo; G0.startSolo = function (n) { META.last = { g, n }; saveMeta(); return f.call(G0, n); }; });

</script>
